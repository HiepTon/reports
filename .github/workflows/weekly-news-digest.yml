# Weekly RSS digest → GitHub Pages, with a browsable history archive.
#
# A lower-frequency clone of the Vietnam digest with its own feeds
# (config/weekly_news_feeds.json). Builds ONLY the Weekly page (weekly/index.html)
# to keep each run's Groq token usage separate. The published site (all digests +
# the dated snapshot archive) lives on the `gh-pages` branch: each run clones it into
# ./site, rebuilds its own page, saves a dated copy under archive/weekly/, rebuilds
# the archive index, commits the branch (that's the history), then deploys ./site to
# Pages. Because ./site already holds the Security and Vietnam pages, nothing needs
# to restore them.
#
# Schedule: 17:00 UTC on Tuesdays and Fridays ≈ 00:00 ICT the next calendar day
# (UTC+7). --days 7 covers a week of feeds. Trigger any time via "Run workflow"
# (workflow_dispatch).

name: Weekly news digest

on:
  schedule:
    - cron: "0 17 * * 2,5"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write   # push the built site + history to the gh-pages branch
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore published site (gh-pages branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git clone --branch gh-pages "$REMOTE" site 2>/dev/null; then
            echo "Cloned existing gh-pages."
          else
            echo "gh-pages does not exist yet; creating an empty site."
            rm -rf site
            git clone "$REMOTE" site
            cd site
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-security-news.txt
            requirements-vietnam-news.txt
            requirements-weekly-news.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-weekly-news.txt

      - name: Build Weekly digest (weekly/index.html)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          # Prefer Gemini when its key is set, else Groq, else RSS excerpts only.
          SUMMARIZE_FLAG=""
          PROVIDER_FLAG=""
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            SUMMARIZE_FLAG="--summarize"; PROVIDER_FLAG="--summary-provider gemini"
            echo "GEMINI_API_KEY set: summarizing via Gemini."
          elif [ -n "${GROQ_API_KEY:-}" ]; then
            SUMMARIZE_FLAG="--summarize"; PROVIDER_FLAG="--summary-provider groq"
            echo "GROQ_API_KEY set: summarizing via Groq."
          else
            echo "No summary key set: RSS excerpts only, category 'Chưa phân loại'."
          fi
          mkdir -p site/weekly
          python scripts/fetch_weekly_news.py \
            --days 4 \
            --per-source 50 \
            --limit 500 \
            --pause 0.3 \
            --html site/weekly/index.html \
            $SUMMARIZE_FLAG $PROVIDER_FLAG

      - name: Snapshot to archive and rebuild archive index
        run: |
          set -e
          DATE="$(date -u +%F)"
          mkdir -p site/archive/weekly
          cp site/weekly/index.html "site/archive/weekly/${DATE}.html"
          python scripts/build_archive_index.py --archive-dir site/archive --out site/archive/index.html
          touch site/.nojekyll

      - name: Publish history to gh-pages
        run: |
          set -e
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(site): weekly digest $(date -u +%F)"
            git push origin gh-pages
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Upload Weekly HTML artifact
        uses: actions/upload-artifact@v7
        with:
          name: weekly-news
          path: site/weekly/index.html
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
